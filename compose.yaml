# Local development stack (P1-02; docs/10 §1.2–1.3, ADR-0003, ADR-0007).
# First run: bash scripts/dev/setup.sh   ·   Daily: docker compose up -d --wait
# Every published port is bound to 127.0.0.1 only. Secrets come from .env and .env.services (both gitignored).
name: competitive-ais

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    args:
      UID: ${DEV_UID:-1000}
      GID: ${DEV_GID:-1000}
  image: competitive-ais/php:dev
  volumes:
    - .:/var/www/html
    - vendor:/var/www/html/vendor
  networks: [app, data]
  restart: unless-stopped
  depends_on:
    mysql: { condition: service_healthy }
    valkey: { condition: service_healthy }
    seaweedfs-init: { condition: service_completed_successfully }
    mailpit: { condition: service_healthy }

services:
  nginx:
    image: nginx:1.30.6-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    networks: [edge, app]
    restart: unless-stopped
    depends_on:
      php: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 6

  php:
    <<: *app

  horizon:
    <<: *app
    command: ["php", "artisan", "horizon"]
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      # Proves the app boots with its config; the process itself is PID 1, so the container stops if it dies.
      test: ["CMD", "php", "artisan", "schedule:list"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  node:
    build:
      context: .
      args:
        UID: ${DEV_UID:-1000}
        GID: ${DEV_GID:-1000}
      dockerfile_inline: |
        FROM node:24.22.2-alpine
        ARG UID
        ARG GID
        RUN mkdir -p /app/node_modules && chown "$${UID}:$${GID}" /app/node_modules
        WORKDIR /app
    image: competitive-ais/node:dev
    # Same uid as the owner of the checkout (like the php image), so .env (mode 600) is readable.
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    command: ["npm", "run", "dev"]
    environment:
      VITE_POLL: "1"
      HOME: /tmp
    ports: ["127.0.0.1:5173:5173"]
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    networks: [edge]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5173/@vite/client"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  mysql:
    image: mysql:8.4.13
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --skip-name-resolve
    env_file: [.env.services]
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      # Least-privilege accounts (P1-09): created by docker/mysql/init/10-accounts.sh.
      CAIS_DATABASES: "${DB_DATABASE} ${DB_TEST_DATABASE:-cais_test}"
      CAIS_MIGRATOR_USER: ${DB_MIGRATOR_USERNAME}
      CAIS_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD}
      CAIS_APP_USER: ${DB_USERNAME}
      CAIS_APP_PASSWORD: ${DB_PASSWORD}
      CAIS_RETENTION_USER: ${DB_RETENTION_USERNAME}
      CAIS_RETENTION_PASSWORD: ${DB_RETENTION_PASSWORD}
      CAIS_READONLY_USER: cais_readonly
    ports: ["127.0.0.1:3307:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks: [data]
    restart: unless-stopped
    healthcheck:
      # mysqladmin ping succeeds without credentials once the server accepts TCP connections.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  valkey:
    image: valkey/valkey:9.1.3-alpine
    command: ["sh", "-c", "exec valkey-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports: ["127.0.0.1:6380:6379"]
    volumes: [valkey-data:/data]
    networks: [data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    entrypoint: ["/bin/sh", "/etc/seaweedfs/start.sh"]
    env_file: [.env.services]
    environment:
      S3_APP_ACCESS_KEY: ${AWS_ACCESS_KEY_ID}
      S3_APP_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY}
    ports: ["127.0.0.1:9000:8333"]
    volumes:
      - ./docker/seaweedfs/start.sh:/etc/seaweedfs/start.sh:ro
      - ./docker/seaweedfs/s3-identities.template.json:/etc/seaweedfs/s3-identities.template.json:ro
      - seaweedfs-data:/data
    networks: [data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  seaweedfs-init:
    image: amazon/aws-cli:2.39.3
    entrypoint: ["/bin/bash", "/init/init.sh"]
    env_file: [.env.services]
    volumes: ["./docker/seaweedfs/init.sh:/init/init.sh:ro"]
    networks: [data]
    restart: "no"
    depends_on:
      seaweedfs: { condition: service_healthy }

  clamav:
    image: clamav/clamav:1.5.4
    volumes: [clamav-db:/var/lib/clamav]
    networks: [data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      # The first start downloads the signature database.
      start_period: 900s

  mailpit:
    image: axllent/mailpit:v1.33.0
    ports: ["127.0.0.1:8025:8025"]
    networks: [data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 6

networks:
  edge: {}
  app: {}
  # Not internal in local dev: ClamAV needs egress for signature updates and ports are published to 127.0.0.1.
  data: {}

volumes:
  vendor: {}
  node_modules: {}
  mysql-data: {}
  valkey-data: {}
  seaweedfs-data: {}
  clamav-db: {}

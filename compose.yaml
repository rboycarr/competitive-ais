# Local development stack (P1-02; docs/10 §1.2–1.3, ADR-0003, ADR-0007).
# First run: bash scripts/dev/setup.sh   ·   Daily: docker compose up -d --wait
# Every published port is bound to 127.0.0.1 only. Secrets come from gitignored env files, each given only to
# the services that need it (TASK-0003 #1, #7): .env (Laravel runtime) and, in .secrets/, migrator.env
# (migrator service, MySQL init), services.env (MySQL), s3.env (SeaweedFS and its init), anchor.env (SeaweedFS and
# the auditor), signing.env (the auditor only; P1-50, PO decision O43), readonly.env (MySQL and the backup service)
# and backup.env (SeaweedFS and the backup service; P1-51). restore.env, the backup decryption key, is used only by
# the drill project (docker/backup/compose.drill.yaml). Every container that
# bind-mounts the repository gets an empty read-only tmpfs over .secrets, so those files are not readable
# inside it (TASK-0004 N2); Compose reads them on the host.
name: competitive-ais

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    args:
      UID: ${DEV_UID:-1000}
      GID: ${DEV_GID:-1000}
  image: competitive-ais/php:dev
  environment:
    # The databases whose table grants db:apply-grants manages: the same list the MySQL init script gets as
    # CAIS_DATABASES, interpolated from .env on the host, so overriding DB_DATABASE in a container (tests, the CI
    # migration round-trip) does not change it (TASK-0007 #1).
    DB_GRANT_DATABASES: "${DB_DATABASE} ${DB_TEST_DATABASE:-cais_test}"
  volumes:
    - .:/var/www/html
    - vendor:/var/www/html/vendor
    - { type: tmpfs, target: /var/www/html/.secrets, read_only: true, tmpfs: { mode: 0555 } }
  networks: [app, data]
  restart: unless-stopped
  depends_on:
    mysql: { condition: service_healthy }
    valkey: { condition: service_healthy }
    seaweedfs-init: { condition: service_completed_successfully }
    mailpit: { condition: service_healthy }

services:
  nginx:
    image: nginx:1.30.6-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    networks: [edge, app]
    restart: unless-stopped
    depends_on:
      php: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 6

  php:
    <<: *app

  horizon:
    <<: *app
    command: ["php", "artisan", "horizon"]
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      # Proves the app boots with its config; the process itself is PID 1, so the container stops if it dies.
      test: ["CMD", "php", "artisan", "schedule:list"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  # Signed audit anchors (P1-50, ADR-0006, PO decision O43): the only service with the signing seed and the
  # audit-anchor key. Closes, signs and exports a checkpoint every five minutes, verifies hourly (audit:work).
  # Locally the manifests are locked in governance mode for a day (O44: compliance for 7 years in production).
  #   docker compose exec auditor php artisan audit:verify
  auditor:
    <<: *app
    env_file: [.secrets/anchor.env, .secrets/signing.env]
    environment:
      DB_GRANT_DATABASES: "${DB_DATABASE} ${DB_TEST_DATABASE:-cais_test}"
      AUDIT_ANCHOR_LOCK_MODE: GOVERNANCE
      AUDIT_ANCHOR_RETENTION_DAYS: "1"
    networks: [data]
    command: ["php", "artisan", "audit:work"]
    healthcheck:
      # Proves the app boots with its config; the process itself is PID 1, so the container stops if it dies.
      test: ["CMD", "php", "artisan", "list", "audit", "--raw"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  # One-shot tool container with the migrator account (TASK-0003 #1): migrations, grants, and tests.
  #   docker compose run --rm migrator php artisan migrate
  # The only PHP service that receives the migrator account. Not started by `up` (profile "tools").
  migrator:
    <<: *app
    profiles: [tools]
    restart: "no"
    env_file: [.secrets/migrator.env]
    command: ["php", "artisan", "migrate", "--no-interaction"]
    depends_on:
      mysql: { condition: service_healthy }

  # Encrypted backup (P1-51, PO decisions O47 and O48): a MySQL dump with the read-only account and every version of
  # the evidence and audit-anchor buckets with the read-only backup key, each encrypted to the age public key, into
  # backups/<UTC time>/. It cannot decrypt what it writes. Not started by `up` (profile "tools").
  #   docker compose run --rm backup
  # Restore drill: bash scripts/ops/restore-drill.sh (restores into a separate cais-drill-<run> project, O46).
  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    image: competitive-ais/backup:dev
    profiles: [tools]
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    env_file: [.secrets/readonly.env, .secrets/backup.env]
    environment:
      DB_DATABASE: ${DB_DATABASE}
      DB_READONLY_USERNAME: cais_readonly
      EVIDENCE_BUCKET: ${EVIDENCE_BUCKET:-evidence}
      AUDIT_ANCHOR_BUCKET: ${AUDIT_ANCHOR_BUCKET:-audit-anchor}
      HOME: /work
    command: ["bash", "/opt/backup/backup.sh"]
    volumes:
      - ./docker/backup:/opt/backup:ro
      - ./backups:/backups
    # Plaintext object copies live only here, in memory, while each is hashed and encrypted.
    tmpfs: ["/work:mode=0700,uid=${DEV_UID:-1000},gid=${DEV_GID:-1000}"]
    networks: [data]
    restart: "no"
    depends_on:
      mysql: { condition: service_healthy }
      seaweedfs-init: { condition: service_completed_successfully }

  # End-to-end exit journey and accessibility (P1-47): Playwright's browser image, the same version as @playwright/test,
  # driving the app through nginx. Not started by `up` (profile "tools"). Run with: bash scripts/ci/e2e.sh
  e2e:
    image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    profiles: [tools]
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    working_dir: /app
    environment:
      HOME: /tmp
      E2E_BASE_URL: http://nginx
    command: ["npx", "playwright", "test", "-c", "e2e/playwright.config.ts"]
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - { type: tmpfs, target: /app/.secrets, read_only: true, tmpfs: { mode: 0555 } }
    networks: [edge]
    restart: "no"

  node:
    build:
      context: .
      args:
        UID: ${DEV_UID:-1000}
        GID: ${DEV_GID:-1000}
      dockerfile_inline: |
        FROM node:24.22.2-alpine
        ARG UID
        ARG GID
        RUN mkdir -p /app/node_modules && chown "$${UID}:$${GID}" /app/node_modules
        WORKDIR /app
    image: competitive-ais/node:dev
    # Same uid as the owner of the checkout (like the php image), so .env (mode 600) is readable.
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    command: ["npm", "run", "dev"]
    environment:
      VITE_POLL: "1"
      HOME: /tmp
    ports: ["127.0.0.1:5173:5173"]
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - { type: tmpfs, target: /app/.secrets, read_only: true, tmpfs: { mode: 0555 } }
    networks: [edge]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5173/@vite/client"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  mysql:
    image: mysql:8.4.13
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --skip-name-resolve
    env_file: [.secrets/services.env, .secrets/migrator.env, .secrets/readonly.env]
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      # Least-privilege accounts (P1-09): created by docker/mysql/init/10-accounts.sh.
      CAIS_DATABASES: "${DB_DATABASE} ${DB_TEST_DATABASE:-cais_test}"
      CAIS_APP_USER: ${DB_USERNAME}
      CAIS_APP_PASSWORD: ${DB_PASSWORD}
      CAIS_RETENTION_USER: ${DB_RETENTION_USERNAME}
      CAIS_RETENTION_PASSWORD: ${DB_RETENTION_PASSWORD}
      CAIS_READONLY_USER: cais_readonly
    ports: ["127.0.0.1:3307:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks: [data]
    restart: unless-stopped
    healthcheck:
      # mysqladmin ping succeeds without credentials once the server accepts TCP connections.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  valkey:
    image: valkey/valkey:9.1.3-alpine
    command: ["sh", "-c", "exec valkey-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports: ["127.0.0.1:6380:6379"]
    volumes: [valkey-data:/data]
    networks: [data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    entrypoint: ["/bin/sh", "/etc/seaweedfs/start.sh"]
    # Only the S3 keys: the server must hold every identity's secret to verify request signatures.
    env_file: [.secrets/s3.env, .secrets/anchor.env, .secrets/backup.env]
    environment:
      S3_APP_ACCESS_KEY: ${AWS_ACCESS_KEY_ID}
      S3_APP_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY}
    # The rendered identity config lives in memory only, mode 700 (TASK-0003 #8).
    tmpfs: ["/run/s3config:mode=0700"]
    ports: ["127.0.0.1:9000:8333"]
    volumes:
      - ./docker/seaweedfs/start.sh:/etc/seaweedfs/start.sh:ro
      - ./docker/seaweedfs/s3-identities.template.json:/etc/seaweedfs/s3-identities.template.json:ro
      - seaweedfs-data:/data
    networks: [data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  seaweedfs-init:
    image: amazon/aws-cli:2.39.3@sha256:d557b3524475d70dd3104cf44d96568ee3188897b73a6ece2b37aa50e1af362f
    entrypoint: ["/bin/bash", "/init/init.sh"]
    env_file: [.secrets/s3.env]
    volumes: ["./docker/seaweedfs/init.sh:/init/init.sh:ro"]
    networks: [data]
    restart: "no"
    depends_on:
      seaweedfs: { condition: service_healthy }

  clamav:
    image: clamav/clamav:1.5.4
    # The image's /init writes CLAMD_CONF_* into clamd.conf. The default stream limit (25M) is below the 50 MB evidence
    # limit, so larger uploads could never be scanned (P1-32b).
    environment:
      CLAMD_CONF_StreamMaxLength: 60M
    volumes: [clamav-db:/var/lib/clamav]
    networks: [data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      # The first start downloads the signature database.
      start_period: 900s

  mailpit:
    image: axllent/mailpit:v1.33.0
    ports: ["127.0.0.1:8025:8025"]
    networks: [data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 6

networks:
  edge: {}
  app: {}
  # Not internal in local dev: ClamAV needs egress for signature updates and ports are published to 127.0.0.1.
  data: {}

volumes:
  vendor: {}
  node_modules: {}
  mysql-data: {}
  valkey-data: {}
  seaweedfs-data: {}
  clamav-db: {}

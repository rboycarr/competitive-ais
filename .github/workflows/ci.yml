# Continuous integration (P1-07, docs/09). Runs the same Docker images as local development.
# Third-party actions are pinned to a commit SHA; the token is read-only.
name: CI

on:
  # Every branch: review branches (handoffs/) must be green before they are merged.
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (Pint, Larastan, Pest on MySQL 8.4, migrations, audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Environment files (random throwaway secrets)
        run: bash scripts/dev/init-env.sh
      - name: Build PHP image (runs as the runner's uid, from DEV_UID in .env)
        run: docker compose build php
      - name: Start MySQL (runs the account init script on a fresh volume)
        run: docker compose up -d --wait mysql
      - name: Composer install (the job's read-only token avoids GitHub's anonymous rate limit)
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
        run: bash scripts/ci/composer-install.sh
      - name: App key
        run: docker compose run --rm --no-deps -T php php artisan key:generate --no-interaction
      - name: Checks
        run: bash scripts/ci/backend.sh

  restore-drill:
    name: restore drill (encrypted backup, restore into cais-drill, damaged backups)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Environment files (random throwaway secrets)
        run: bash scripts/dev/init-env.sh
      - name: Build the PHP and backup images
        run: docker compose --profile tools build php backup
      - name: Backup key pair (throwaway)
        run: bash scripts/ops/backup-keys.sh
      - name: Start MySQL, Valkey, the object store and mail
        run: docker compose up -d --wait mysql valkey seaweedfs mailpit && docker compose up seaweedfs-init --exit-code-from seaweedfs-init
      - name: Composer install (the job's read-only token avoids GitHub's anonymous rate limit)
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
        run: bash scripts/ci/composer-install.sh
      - name: App key
        run: docker compose run --rm --no-deps -T php php artisan key:generate --no-interaction
      - name: Backup, drill, damaged backups
        run: bash scripts/ci/restore-drill-test.sh

  e2e:
    name: e2e (exit journey J1 + J6, axe on core pages)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Environment files (random throwaway secrets)
        run: bash scripts/dev/init-env.sh
      - name: Build the PHP and Node images
        run: docker compose build php node
      - name: Start MySQL, Valkey, the object store and mail
        run: docker compose up -d --wait mysql valkey seaweedfs mailpit && docker compose up seaweedfs-init --exit-code-from seaweedfs-init
      - name: Composer install (the job's read-only token avoids GitHub's anonymous rate limit)
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
        run: bash scripts/ci/composer-install.sh
      - name: App key, migrations, npm ci
        run: |
          docker compose run --rm --no-deps -T php php artisan key:generate --no-interaction
          docker compose run --rm -T migrator php artisan migrate --force --no-interaction
          docker compose run --rm --no-deps -T node npm ci
      - name: Exit journey
        run: bash scripts/ci/e2e.sh

  frontend:
    name: frontend (Vitest, build, audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Environment files
        run: bash scripts/dev/init-env.sh
      - name: Build Node image (runs as the runner's uid, from DEV_UID in .env)
        run: docker compose build node
      - name: npm ci
        run: docker compose run --rm --no-deps -T node npm ci
      - name: Checks
        run: bash scripts/ci/frontend.sh

  secrets:
    name: secrets (gitleaks, full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: bash scripts/ci/secrets.sh

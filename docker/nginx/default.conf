# Local development vhost. Security headers (CSP nonce etc.) come from the app middleware (P1-08).
#
# Responses nginx produces itself (static files, its own 403/404/50x, PHP unreachable) get fallback headers here
# (TASK-0014 #2). Each map yields a value only when the upstream response did not set the header, so app
# responses keep their own CSP with its nonce and are never sent two policies.
map $upstream_http_content_security_policy $fallback_csp {
    ""      "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'";
    default "";
}
map $upstream_http_x_content_type_options $fallback_nosniff { "" "nosniff"; default ""; }
map $upstream_http_x_frame_options $fallback_frame_options { "" "DENY"; default ""; }
map $upstream_http_referrer_policy $fallback_referrer_policy { "" "strict-origin-when-cross-origin"; default ""; }
map $upstream_http_x_request_id $fallback_request_id { "" $request_id; default ""; }

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    server_tokens off;
    client_max_body_size 55m;
    charset utf-8;

    # Inherited by every location below (none defines its own add_header); "always" covers error responses.
    add_header Content-Security-Policy $fallback_csp always;
    add_header X-Content-Type-Options $fallback_nosniff always;
    add_header X-Frame-Options $fallback_frame_options always;
    add_header Referrer-Policy $fallback_referrer_policy always;
    add_header X-Request-Id $fallback_request_id always;

    # Re-resolve "php" through Docker's DNS, so recreating the php container (new IP) does not leave nginx
    # pointing at the old address (502 until nginx restarts).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream php:9000;

    # nginx's own liveness, independent of PHP.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass $php_upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        internal;
    }

    # Any other .php file and any dotfile is never served.
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}

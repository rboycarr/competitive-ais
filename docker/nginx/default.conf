# Local development vhost. Security headers (CSP nonce etc.) come from the app middleware (P1-08).
server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    server_tokens off;
    client_max_body_size 55m;
    charset utf-8;

    # Re-resolve "php" through Docker's DNS, so recreating the php container (new IP) does not leave nginx
    # pointing at the old address (502 until nginx restarts).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream php:9000;

    # nginx's own liveness, independent of PHP.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass $php_upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        internal;
    }

    # Any other .php file and any dotfile is never served.
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}

[www]
; The container already runs as www-data; user/group directives are not needed.
; Wall-clock limit per request (max_execution_time does not count database waits): a request, and so its transaction,
; ends well inside the audit lag window (P1-50, docs/10 §5). The worker is killed and MySQL rolls the transaction back.
request_terminate_timeout = 120s
ping.path = /fpm-ping
ping.response = pong
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

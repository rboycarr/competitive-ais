; Local development settings. Production values are set in the production image (docs/10 §3).
date.timezone = UTC
expose_php = Off
memory_limit = 512M
upload_max_filesize = 50M
post_max_size = 55M
max_execution_time = 60

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

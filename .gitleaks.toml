# gitleaks configuration (P1-07; narrowed after TASK-0003 #9). Default rules plus one narrow suppression.
[extend]
useDefault = true

# An empty placeholder line (KEY=) is followed by a line break; the generic-api-key rule then reads the next
# line's key name as the "secret". Suppress only findings whose match contains "=" directly followed by a line
# break, i.e. where the "value" is not on the key's line. No file is exempt: real values are still found,
# including in env example files (verified with a planted token). scripts/ci/secrets.sh additionally requires
# secret-like keys in example files to be empty.
[[allowlists]]
description = "Empty KEY= placeholder followed by a line break"
regexTarget = "match"
regexes = ['''=[ \t]*\r?\n''']
